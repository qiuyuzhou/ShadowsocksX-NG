# 默认规则起步：只声明排除项，遇到实际痛点再调规则（见本目录 AGENTS.md）。
# 路径相对本文件所在目录。
excluded:
  # 构建产物
  - DerivedData
  - .build
  # 冻结目录：Legacy/ 只读，不 format / lint（本配置位于 ShadowsocksX-NG2/ 内，
  # 常规调用天然扫不到它；此条保证带 --config 从仓库根调用时也明确排除）
  - ../Legacy
disabled_rules:
  # 与 .swift-format 基线冲突：SwiftFormat 的多元素集合尾逗号和
  # 多行条件/签名的换行规则会被 SwiftLint 的自动修正规则改回去。
  # 触发案例：Domain/CredentialStore.swift 的 Keychain 查询字典由
  # multiElementCollectionTrailingCommas=true 保留尾逗号；
  # App/SettingsView.swift 的多行条件由 SwiftFormat 保留独立的 {。
  # pre-commit 先 format 再 lint；关闭冲突规则以 .swift-format 为准。
  - trailing_comma
  - opening_brace
