name: ShadowsocksX-NG2
options:
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: S878RH3PA8
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      # 发布基线：签名 entitlements 必须只来自项目 entitlements 文件（保持最小）。
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  ShadowsocksX-NG2:
    type: application
    platform: macOS
    sources:
      - path: App
      # 领域核心：配置目录树、凭据引用与持久化（spec #21 D3/D5）
      - path: Domain
      # 外部二进制（Vendor/<name>/manifest.json 固定 tag+URL+SHA-256）。必须先跑
      # Scripts/fetch-external-binaries.sh 再 xcodegen generate：文件在生成时必须已存在，
      # 否则 Copy Files 阶段会被静默丢弃。构建内的 preBuildScripts 只做增量复验，
      # 哈希或清单漂移会在构建时失败。
      - path: Vendor/sslocal/sslocal
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      - path: Vendor/v2ray-plugin/v2ray-plugin
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers/Plugins
    preBuildScripts:
      - name: Fetch & verify external binaries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "$SRCROOT/Scripts/fetch-external-binaries.sh"
    postBuildScripts:
      # 必须在 app 自身签名之前逐二进制 DevID 重签；Xcode 在所有脚本阶段之后
      # 完成 app 外层签名，封存重签后的嵌套代码。
      - name: Sign embedded helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "$SRCROOT/Scripts/sign-embedded-helpers.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiuyuzhou.ShadowsocksX-NG
        PRODUCT_NAME: ShadowsocksX-NG2
        CODE_SIGN_IDENTITY: "Developer ID Application"
        MARKETING_VERSION: "2.0.0"
        # 必须 > 旧版 1.x 已发布构建的 CFBundleVersion（始终为 1），保证 build 号严格递增。
        CURRENT_PROJECT_VERSION: 2
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: App/ShadowsocksX-NG2.entitlements
      properties: {}
    scheme:
      testTargets:
        - ShadowsocksX-NG2Tests
  ShadowsocksX-NG2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiuyuzhou.ShadowsocksX-NG.Tests
        # 必须与宿主 app 同 Team 签名：Hardened Runtime 的 library validation 拒绝
        # 加载不同 Team ID 的非平台库，ad-hoc（"-"）签名的 xctest 包无法注入。
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Tests/Info.plist
      properties: {}
    dependencies:
      - target: ShadowsocksX-NG2
